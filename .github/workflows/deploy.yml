name: Build and deploy

# Builds the newsfeed and publishes it to this repo's GitHub Pages site. Nothing here needs a key or an
# account anywhere else.
#
# This repo is also the template that "Use this template" copies, so everything that's particular to one
# newsfeed comes from the repo's own settings (Settings → Secrets and variables → Actions), which a copy
# doesn't inherit:
#   SITE_URL    (variable) where it's published, for a domain of your own. Without it, GitHub Pages' own address.
#   EVENTS_URL  (variable) a sister site to name in the header beside it. Without it, the header names only this.
#   YOUTUBE_KEY (secret)   a free YouTube Data API key, for a channel whose feed won't load.
on:
  push:
    branches: [main]
  schedule:
    # GitHub runs schedules when it can and drops a lot of them, most often at :00 and :30, when everyone's
    # cron fires. Odd minutes are quieter. See the README for making it reliable.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write  # shared/alerts.py opens and closes "Source failing" issues.

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # The feed readers against saved samples of real feeds, so a change that breaks them isn't published.
      - run: python3 -m unittest
      - run: python3 -m news.build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EVENTS_URL: ${{ vars.EVENTS_URL }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/news
      - id: deployment
        uses: actions/deploy-pages@v4

      # An issue for any site failing for hours (GitHub emails about it); never holds up the page.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -m shared.alerts news=dist/news/feeds.json
        env:
          GH_TOKEN: ${{ github.token }}

  # GitHub turns off a repo's schedules after 60 days without a commit, which would freeze the page. If the
  # repo has been quiet for 50 days, an empty commit resets that clock.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled build running"
            git push
          fi
